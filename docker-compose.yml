services:

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bcb-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: bcb-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/bcb-raw;
      mc mb --ignore-existing local/bcb-bronze;
      mc mb --ignore-existing local/bcb-silver;
      mc mb --ignore-existing local/bcb-gold;
      mc admin user add local ${MINIO_SPARK_USER} ${MINIO_SPARK_PASSWORD} || true;
      mc admin policy attach local readwrite --user ${MINIO_SPARK_USER};
      exit 0;
      "

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: bcb-spark
    working_dir: /opt/spark-apps
    volumes:
      - ./spark:/opt/spark-apps
      - ./config:/opt/spark-apps/config
    depends_on:
      - minio
    command: tail -f /dev/null
    environment:
      PYTHONPATH: /opt/spark-apps

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_SPARK_USER}
      MINIO_SECRET_KEY: ${MINIO_SPARK_PASSWORD}

      RAW_BUCKET: ${RAW_BUCKET}
      BRONZE_BUCKET: ${BRONZE_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      GOLD_BUCKET: ${GOLD_BUCKET}

volumes:
  minio_data: