services:

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bcb-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: bcb-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/bcb-bronze;
      mc mb --ignore-existing local/bcb-silver;
      mc mb --ignore-existing local/bcb-gold;
      mc admin user add local ${MINIO_SPARK_USER} ${MINIO_SPARK_PASSWORD} || true;
      mc admin policy attach local readwrite --user ${MINIO_SPARK_USER};
      exit 0;
      "

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: bcb-spark
    working_dir: /opt/spark-apps
    volumes:
      - ./spark:/opt/spark-apps
      - ./config:/opt/spark-apps/config
    depends_on:
      - minio
      - postgres
    command: tail -f /dev/null
    environment:
      PYTHONPATH: /opt/spark-apps

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_SPARK_USER}
      MINIO_SECRET_KEY: ${MINIO_SPARK_PASSWORD}

      BRONZE_BUCKET: ${BRONZE_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      GOLD_BUCKET: ${GOLD_BUCKET}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  postgres:
    image: postgres:16
    container_name: bcb-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data: